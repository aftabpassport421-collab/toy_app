name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # STEP 1: Create dummy .env files FIRST so Gradle evaluation passes
      - name: Create dummy .env.example
        run: touch .env.example .env

      # STEP 2: Regenerate wrapper now that build scripts won't crash
      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --no-daemon

      # STEP 3: Grant execute permission to the newly generated gradlew file
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # STEP 4: Run Android build
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # STEP 5: Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
